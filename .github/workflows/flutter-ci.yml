name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
    - ".github/**/*.md"
  push:
    branches:
      - master
      - develop
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/**/*.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

jobs:
  run-ci:
    permissions:
      contents: write
    uses: ./.github/workflows/flutter-build.yml
    with:
      # Publish downloadable builds (incl. Android APKs) on pushes to master/develop,
      # but keep pull_request runs artifact-free (build verification only).
      upload-artifact: ${{ github.event_name == 'push' }}
      # PR / develop / master: only the common packages (Windows x64, Linux
      # amd64+arm64, macOS arm64, Android arm64). Nightly and tag workflows
      # keep the default full-build: true.
      full-build: false
