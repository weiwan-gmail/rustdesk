name: Full Flutter CI

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build. windows-linux-web skips Android/macOS/iOS."
        type: choice
        default: windows-linux-web
        options:
          - windows
          - linux
          - web-direct
          - windows-linux-web
          - all-common
          - full
      upload-artifact:
        description: "Upload artifacts and publish to a GitHub Release"
        type: boolean
        default: true
      upload-tag:
        description: "Release tag to publish to (prerelease). Default nightly."
        type: string
        default: "nightly"

jobs:
  run-ci:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: ${{ inputs.upload-artifact }}
      upload-tag: ${{ inputs.upload-tag || 'nightly' }}
      full-build: ${{ inputs.platforms == 'full' }}
      platforms: ${{ inputs.platforms }}
