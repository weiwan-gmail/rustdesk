# Portal mode: nginx equivalent of portal/Caddyfile.
# Build the web client with BASE_HREF=/rustdesk/ first.
#
# Put these blocks into the existing portal site's `server {}`.

# RustDesk web client static pages (note the trailing slashes: the
# /rustdesk/ prefix is stripped before hitting the web service).
location /rustdesk/ {
    proxy_pass http://rustdesk-web:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# WebSocket endpoints (official layout, reusable as-is).
location /ws/id {
    proxy_pass http://hbbs:21118;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}

location /ws/relay {
    proxy_pass http://hbbr:21119;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}
